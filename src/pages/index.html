:root{--ink:#111;--lime:#bbff00;--orange:#ff6a13;--cream:#fffbe9;
  --bg:#f1efe7;--ring:rgba(17,17,17,.05);--line:#111;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;--b7:'BL700',sans-serif;--b5:'BL500',sans-serif;--b4:'BL400',sans-serif;
  --slant:-7deg;--k:1;color-scheme:light dark;font-family:var(--body)}
@media(prefers-color-scheme:dark){:root{--bg:#0d0d0c;--ring:rgba(255,255,255,.05);--line:#f4f4ef}}
@media(max-width:600px){:root{--slant:-4deg}}
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;color:var(--ink);-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 88% 84%,transparent 0 6rem,var(--ring) 6rem 6.25rem,transparent 6.25rem 10rem,var(--ring) 10rem 10.25rem,transparent 10.25rem),radial-gradient(circle at 6% 20%,transparent 0 5rem,var(--ring) 5rem 5.25rem,transparent 5.25rem 8.5rem,var(--ring) 8.5rem 8.75rem,transparent 8.75rem);
  background-attachment:fixed}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block;pointer-events:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:4px solid var(--line);outline-offset:4px;border-radius:999px}
.pad{width:100%;max-width:98rem;margin:0 auto;padding:0 clamp(14px,2.6vw,44px)}

.stage{flex:1 0 auto;align-content:center;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);gap:clamp(18px,3.4vw,56px);align-items:center;padding-top:clamp(14px,3.4vh,40px);padding-bottom:clamp(2.4rem,6.6vh,4.4rem)}
.left{container-type:inline-size;min-width:0}
.mark{display:block;height:clamp(3.6rem,15vh,8.4rem);width:auto;max-width:100%;margin:0 0 clamp(.7rem,2.4vh,1.8rem) clamp(.2rem,1vw,1rem)}

.rows{list-style:none;margin:0;padding:0;display:grid;gap:clamp(.5rem,2.5vh,1.7rem)}
.rows li:nth-child(1){margin-left:clamp(.8rem,2vw,2.2rem)}
.rows li:nth-child(2){margin-left:clamp(2rem,5vw,5.4rem)}
.rows li:nth-child(3){margin-left:clamp(1rem,2.6vw,2.8rem)}
.row{--pl:clamp(2.8rem,8vh,4.6rem);--gap:clamp(.35rem,.8vw,.55rem);position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(var(--pl),auto) auto;align-items:center;gap:0 1rem;background:var(--lime);border:5px solid var(--line);border-radius:calc(var(--pl)/2 + var(--gap) + 5px);padding:var(--gap) clamp(1.8rem,3vw,2.8rem) var(--gap) var(--gap);box-shadow:inset 0 0 0 3px var(--bg),6px 8px 0 var(--line);transition:transform .12s,background .12s,color .12s}
.pl{grid-row:1;grid-column:1;align-self:center;display:grid;place-items:center;width:var(--pl);height:var(--pl);border-radius:50%;background:var(--ink);color:var(--lime)}
.pl svg{width:38%;height:38%}
.t{grid-row:1;grid-column:2;display:block;font-family:var(--b7);font-weight:400;font-size:min(clamp(1.05rem,2vw,1.9rem),3.9cqw);line-height:1.12;text-transform:uppercase;transform:skewX(var(--slant));transform-origin:left center;padding-right:.4em;overflow-wrap:anywhere;color:inherit}
.meta{grid-row:1;grid-column:3;display:grid;grid-template-columns:5.4em 4.6em;column-gap:1rem;align-items:center}
.k{font-family:var(--b4);font-weight:400;font-size:clamp(.78rem,1.2vw,1.05rem);text-transform:uppercase;text-align:right;letter-spacing:.04em}
.y{font-family:var(--b7);font-weight:400;font-size:clamp(.78rem,1.2vw,1.05rem);text-align:center;border:3px solid var(--ink);border-radius:999px;padding:.15em 0;background:var(--lime);width:4.6em}
/* hover, focus or tap: the row itself grows and the Bandcamp and Soundcloud buttons appear under the title */
.rows li{position:relative}
.rows li:hover,.rows li:focus-within,.rows li:has(.row.open){z-index:6}
.acts{grid-column:2/-1;contain:inline-size;display:flex;flex-wrap:wrap;gap:.55rem;max-height:0;overflow:hidden;opacity:0;visibility:hidden;padding:0;transition:max-height .18s,padding .18s,opacity .14s,visibility 0s .18s}
.act{display:inline-flex;align-items:center;justify-content:center;font-family:var(--b7);font-size:clamp(.74rem,1vw,.92rem);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:var(--cream);color:var(--ink);border:3px solid var(--line);border-radius:999px;padding:.5em 1.3em;box-shadow:inset 0 0 0 2px var(--bg);transition:background .12s}
.act:hover,.act:focus-visible{background:var(--lime)}
.row:hover,.row:focus-within,.row.open{background:var(--ink);color:var(--lime)}
.row:hover .pl,.row:focus-within .pl,.row.open .pl{background:var(--lime);color:var(--ink)}
.row:hover .y,.row:focus-within .y,.row.open .y{background:var(--ink);border-color:var(--lime)}
.row:hover .acts,.row:focus-within .acts,.row.open .acts{max-height:4.2rem;padding:.45rem 0 0;opacity:1;visibility:visible;transition:max-height .18s,padding .18s,opacity .14s,visibility 0s}

.right{display:grid;grid-template-rows:1fr 1fr auto;gap:clamp(.9rem,3.2vh,2.4rem);min-width:0}
.cap{display:grid;align-content:space-evenly;gap:clamp(.3rem,.9vh,.7rem);border:5px solid var(--line);border-radius:clamp(3rem,7vw,7.5rem);box-shadow:inset 0 0 0 3px var(--bg),7px 9px 0 var(--line);container-type:inline-size;transition:transform .12s;padding:clamp(1.1rem,3.8vh,2.6rem) clamp(2.6rem,4.6vw,4.6rem)}
.cap:hover,.cap:focus-visible{transform:translate(4px,4px)}
.cap.insta{background:var(--orange)}
.cap.mail{background:#171717;color:#fff;margin-left:clamp(0rem,3vw,3.4rem)}
.tag{justify-self:start;font-family:var(--b7);font-size:clamp(.78rem,1.15vw,1.1rem);text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--orange);border-radius:999px;padding:.3em 1em}
.mail .tag{background:#fff;color:var(--ink)}
.outline{font-family:var(--b7);font-weight:400;color:#fff;text-transform:uppercase;-webkit-text-stroke:.17em var(--ink);paint-order:stroke fill;text-shadow:.06em .09em 0 var(--ink);transform:skewX(var(--slant));transform-origin:left bottom;display:inline-block;line-height:1}
.plain{font-family:var(--b7);font-weight:400;color:var(--ink);text-transform:uppercase;transform:skewX(var(--slant));transform-origin:left bottom;display:inline-block;line-height:1}
.big{font-size:min(calc(clamp(1.5rem,7.4vh,5.2rem)*var(--k)),12.6cqw);white-space:nowrap}
.big .arw{width:.6em;height:.6em;margin-left:.1em;stroke:none}
.sub{font-family:var(--b4);font-size:clamp(.82rem,1.25vw,1.15rem);text-transform:uppercase;letter-spacing:.04em}
.addr{font-family:var(--b7);font-weight:400;font-size:min(calc(clamp(1.2rem,5.4vh,3.8rem)*var(--k)),9.8cqw);line-height:1.05;text-transform:uppercase;transform:skewX(var(--slant));transform-origin:left bottom;display:block;padding-right:.3em}
.cap:hover .addr{color:var(--orange)}

/* elsewhere: small capsules, brand icon in a round cap, name inside */
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(.5rem,1vw,1rem);margin-top:clamp(.2rem,1vh,.8rem);container-type:inline-size}
.lnk{display:flex;justify-content:flex-start;min-width:0;align-items:center;gap:clamp(.5rem,.8vw,.8rem);background:var(--cream);border:5px solid var(--line);border-radius:999px;padding:clamp(.25rem,.7vh,.45rem) clamp(1rem,1.6vw,1.5rem) clamp(.25rem,.7vh,.45rem) clamp(.25rem,.5vw,.4rem);box-shadow:inset 0 0 0 3px var(--bg),5px 7px 0 var(--line);transition:transform .12s,background .12s}
.lnk .ic{display:grid;place-items:center;width:clamp(2.2rem,6.2vh,3.7rem);aspect-ratio:1;border-radius:50%;background:var(--ink);color:var(--cream);flex:none}
.lnk .ic svg{width:56%;height:56%}
.lnk[aria-label=Soundcloud] .ic svg{width:64%;height:64%;transform:translateX(-4%)}
.lnk .lb{font-family:var(--b7);font-size:clamp(.78rem,1.1vw,1.05rem);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;color:var(--ink)}
.lnk:hover,.lnk:focus-visible{background:var(--lime);transform:translateY(-3px)}
/* alternative: icon-only round buttons (add #links=circles) */
html.circles .lnk{padding:0;border-radius:50%;aspect-ratio:1;width:clamp(3.4rem,8.6vh,5rem);justify-content:center}
@media(max-width:1200px){.right{grid-template-rows:none}}

/* ---- three internal designs for the big Instagram and Contact capsules (pick with #cap=a, b or c) ---- */
.disc2,.chips{display:none}
.cap .txt{display:grid;gap:clamp(.3rem,.9vh,.7rem);min-width:0}
.cap{align-content:normal}
.chips span{display:inline-block;font-family:var(--b7);font-size:clamp(.74rem,1vw,.95rem);text-transform:uppercase;letter-spacing:.05em;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:.25em 1em}
/* A: capsule with a round end, the way the real menu does it. The disc holds an arrow or an @, not a brand icon */
html[data-cap="a"] .cap{align-items:center;column-gap:clamp(.8rem,1.4vw,1.4rem)}
html[data-cap="a"] .cap.insta{grid-template-columns:minmax(0,1fr) auto;padding:clamp(1rem,3.4vh,2.4rem) clamp(1rem,1.5vw,1.5rem) clamp(1rem,3.4vh,2.4rem) clamp(2.2rem,3.6vw,3.8rem)}
html[data-cap="a"] .cap.mail{grid-template-columns:auto minmax(0,1fr);padding:clamp(1rem,3.4vh,2.4rem) clamp(2rem,3.4vw,3.6rem) clamp(1rem,3.4vh,2.4rem) clamp(1rem,1.5vw,1.5rem)}
html[data-cap="a"] .disc2{display:grid;place-items:center;width:clamp(5rem,min(19vh,15cqw),9.5rem);aspect-ratio:1;border:6px solid var(--line);border-radius:50%;background:var(--cream);color:var(--ink);box-shadow:inset 0 0 0 3px var(--bg),5px 7px 0 var(--line)}
html[data-cap="a"] .cap.insta .disc2{background:var(--cream)}
html[data-cap="a"] .disc2 svg{width:46%;height:46%;stroke:none}
html[data-cap="a"] .disc2 svg path{stroke-width:4.4}
html[data-cap="a"] .at{font-family:var(--b7);font-size:clamp(2.2rem,7vh,4.6rem);line-height:1;transform:skewX(var(--slant))}
html[data-cap="a"] .big{font-size:min(calc(clamp(1.5rem,7.4vh,5.2rem)*var(--k)),10.4cqw)}
html[data-cap="a"] .addr{font-size:min(calc(clamp(1.2rem,5.4vh,3.8rem)*var(--k)),8cqw)}
html[data-cap="a"] .sub{white-space:normal}
html[data-cap="a"] .big .arw{display:none}
/* B: the words stay, the space fills with real content as pills */
html[data-cap="b"] .cap{align-content:center;gap:clamp(.5rem,1.6vh,1.2rem)}
html[data-cap="b"] .cap .sub{display:none}
html[data-cap="b"] .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:clamp(.3rem,1.2vh,.9rem)}
html[data-cap="b"] .mail .chips span{background:var(--orange)}
/* C: no stretching. Capsules keep their natural size, and the whole right column sits centred beside the music */
html[data-cap="c"] .right{grid-template-rows:none;align-self:center}
html[data-cap="c"] .cap{align-content:center}
@media(max-width:1200px){html[data-cap] .right{align-self:auto}html[data-cap="a"] .disc2{width:4.4rem}html[data-cap="a"] .cap.insta{padding:1rem 1.2rem 1rem 2.6rem}html[data-cap="a"] .cap.mail{padding:1rem 2.6rem 1rem 1.2rem}html[data-cap="a"] .sub{white-space:normal}}
html.circles .links{display:flex!important;justify-content:flex-start!important;gap:clamp(.8rem,1.6vw,1.4rem)!important}
html.circles .lnk{padding:0!important;width:clamp(3.8rem,10vh,5.6rem)!important;flex:none!important}
html.circles .lnk .ic{width:100%!important;background:none;color:var(--ink)}
html.circles .lnk .ic svg{width:52%;height:52%}
html.circles .lnk .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

@media(max-width:1200px){
  .mk{margin-left:auto;margin-right:auto}
  .stage{grid-template-columns:minmax(0,1fr)}
  .cap.mail{margin-left:0}
  .rows li{margin-left:0!important}
  .mark{margin-left:auto;margin-right:auto}
  .t{font-size:min(clamp(1rem,2.6vw,1.7rem),3.9cqw)}
  .plain{font-family:var(--b7);font-weight:400;color:var(--ink);text-transform:uppercase;transform:skewX(var(--slant));transform-origin:left bottom;display:inline-block;line-height:1}
.big{font-size:min(calc(clamp(1.3rem,5vw,3rem)*var(--k)),12cqw)}
  .addr{font-size:min(calc(clamp(1.1rem,4.4vw,2.4rem)*var(--k)),9.6cqw)}
  .cap{padding:1rem 2rem}
}
/* phones: smaller circles inside the green releases and the social links */
@media(max-width:700px){
  .acts{flex-wrap:nowrap;gap:.4rem;padding-right:0}
  .row:hover .acts,.row:focus-within .acts,.row.open .acts{padding-right:0}
  .row{--pl:2.7rem;--gap:.4rem}
  .pl svg{width:36%;height:36%}
}
@media(max-width:360px){.row{--pl:2.5rem}}

/* social links: sizes tied to the width they actually get, placed after the base rules so they win */
.lnk .lb{font-size:min(clamp(.78rem,1.1vw,1.05rem),2.2cqw)}
.lnk .ic{width:min(clamp(2.2rem,6.2vh,3.7rem),8cqw)}
.lnk{padding-right:min(clamp(.8rem,1.4vw,1.3rem),3.2cqw);padding-left:min(.4rem,1cqw)}
/* narrow rows (phones): one line still -- play circle, title, and the type stacked over the year at the right */
@container (max-width:520px){
  .row{padding-right:1.5rem}
  .meta{grid-template-columns:auto;row-gap:.25rem;justify-items:end}
  .meta{row-gap:.12rem;align-self:center}
  .k{font-size:.6rem;line-height:1.1;text-align:right}
  .y{width:3.5rem;font-size:.68rem;line-height:1.1;border-width:2.5px;padding:.12em 0}
  .act{font-size:.62rem;padding:.4em 1em;border-width:2.5px}
  .t{font-size:min(clamp(.95rem,4.4vw,1.4rem),5.4cqw)}
}
/* narrow social row: three equal cells, icon above the name */
@container (max-width:345px){
  .t{font-size:3.8cqw}
}
@container (max-width:300px){
  .lnk .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .lnk{padding:.6rem .25rem}
  .lnk .ic{width:2.6rem}
}
@container (max-width:470px){
  .lnk{flex-direction:column;gap:.35rem;padding:.55rem .25rem .6rem;border-radius:1.8rem}
  .lnk .ic{width:clamp(2.1rem,10cqw,2.6rem)}
  .lnk .lb{font-size:min(.68rem,3.5cqw);letter-spacing:.02em}
}

.foot{text-align:center;font-family:var(--b4);font-size:clamp(.7rem,.9vw,.85rem);text-transform:uppercase;letter-spacing:.08em;color:var(--ink);padding:0 14px clamp(1rem,2.4vh,1.6rem);opacity:.75}
@media(prefers-color-scheme:dark){.foot{color:var(--line)}}
/* menu feel: springy hover, pop-in on load */
.row,.cap,.lnk{transition-timing-function:cubic-bezier(.34,1.56,.64,1)}
.cap:hover,.cap:focus-visible{transform:translate(4px,4px) scale(1.012,.99)}
.lnk:hover,.lnk:focus-visible{transform:translateY(-3px) scale(1.04,.97)}
@keyframes pop{0%{opacity:0;transform:translateY(26px) scale(.9)}55%{opacity:1;transform:translateY(-5px) scale(1.02)}100%{opacity:1;transform:none}}
.mk{display:block;width:fit-content;max-width:100%}
.mark{animation:pop .7s cubic-bezier(.34,1.56,.64,1) backwards}
.rows li{animation:pop .65s cubic-bezier(.34,1.56,.64,1) backwards}
.rows li:nth-child(1){animation-delay:.12s}.rows li:nth-child(2){animation-delay:.2s}.rows li:nth-child(3){animation-delay:.28s}
.cap.insta{animation:pop .65s cubic-bezier(.34,1.56,.64,1) .18s backwards}.cap.mail{animation:pop .65s cubic-bezier(.34,1.56,.64,1) .26s backwards}.links{animation:pop .65s cubic-bezier(.34,1.56,.64,1) .34s backwards}
@media(max-width:1200px){.links{gap:clamp(1.15rem,3.6vw,1.9rem)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;uniform float uT;uniform float uDark;uniform int uPat;
out vec4 o;
float h(vec2 p){p=fract(p*vec2(443.897,441.423));p+=dot(p,p.yx+19.19);return fract((p.x+p.y)*p.x);}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  float a=h(i.xy+i.z*17.3),b=h(i.xy+vec2(1.,0.)+i.z*17.3),c=h(i.xy+vec2(0.,1.)+i.z*17.3),d=h(i.xy+vec2(1.)+i.z*17.3);
  float a2=h(i.xy+(i.z+1.)*17.3),b2=h(i.xy+vec2(1.,0.)+(i.z+1.)*17.3),c2=h(i.xy+vec2(0.,1.)+(i.z+1.)*17.3),d2=h(i.xy+vec2(1.)+(i.z+1.)*17.3);
  return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(a2,b2,f.x),mix(c2,d2,f.x),f.y),f.z);}
float fbm(vec2 p,float t){float v=0.,amp=.5;for(int i=0;i<2;i++){v+=amp*vn(vec3(p,t));p=p*2.03+vec2(7.1,3.7);t*=1.1;amp*=.22;}return v/.61;}
float fillAA(float d){float w=fwidth(d)*1.1+1e-5;return 1.-smoothstep(-w,w,d);}
void main(){
  vec2 res=uRes;vec2 uv=gl_FragCoord.xy/res.y;float asp=res.x/res.y;
  float a=0.;float k=.07;float a2=0.;float k2=0.;vec3 cA=vec3(-1.);vec3 cB=vec3(0.);
  if(uPat==22){ /* dotwave: staggered round dots that swell and shrink as a wave passes */
    float sc=15.;vec2 g=uv*sc;g.x+=.5*mod(floor(g.y),2.);
    vec2 id=floor(g);vec2 f=fract(g)-.5;
    float wv=.5+.5*sin(length((id+.5)/sc-vec2(asp*.3,.5))*9.-uT*.5);
    float d=length(f)-(.07+.41*wv);
    float a=1.-smoothstep(-fwidth(d)*1.1,fwidth(d)*1.1,d);
    vec3 lo=mix(vec3(.985),vec3(.035),uDark),ink=mix(vec3(.90),vec3(.14),uDark);
    o=vec4(mix(lo,ink,a),1.);return;
  }
  if(uPat==9){ /* terrain: layered noise, quantized into steps, tones of one colour */
    vec2 p=uv*1.25;
    float n=fbm(p,uT*.06);
    n=clamp((n-.22)/.56,0.,1.);
    const float N=10.;
    float w=fwidth(n)*1.1+1e-4;
    float lv=0.;for(int i=1;i<10;i++){lv+=smoothstep(-w,w,n-float(i)/N);}
    lv/=(N-1.);
    vec3 lo=mix(vec3(.985),vec3(.035),uDark),hi=mix(vec3(.80),vec3(.19),uDark);
    o=vec4(mix(lo,hi,lv),1.);return;
  }
  if(uPat==0){ /* dots: Kirby polka, staggered rows, dots breathe */
    vec2 p=uv*11.+vec2(uT*.02,uT*.012);p.x+=.5*mod(floor(p.y),2.);
    vec2 id=floor(p);vec2 f=fract(p)-.5;
    float r=.17+.06*sin(uT*.5+h(id)*6.2832);
    a=fillAA(length(f)-r);k=.085;
  }else if(uPat==1){ /* checker: Sonic zone checks, gently warped */
    vec2 p=uv*6.5+vec2(uT*.02,uT*.012);
    p+=.22*vec2(sin(p.y*1.1+uT*.25),cos(p.x*1.1+uT*.2));
    float s=sin(3.14159*p.x)*sin(3.14159*p.y);
    float w=fwidth(s)*1.1+1e-4;a=smoothstep(-w,w,s);k=.05;
  }else if(uPat==2){ /* sparkles: four-point stars that twinkle */
    vec2 p=uv*8.+vec2(uT*.015,uT*.01);vec2 id=floor(p);vec2 f=fract(p)-.5;
    float r1=h(id);
    f-=(vec2(h(id+1.7),h(id+4.1))-.5)*.36;
    float size=(.07+.14*h(id+9.))*(.65+.35*sin(uT*.9+r1*40.));
    float g=sqrt(abs(f.x))+sqrt(abs(f.y));
    a=(r1>.22)?fillAA((g-sqrt(size))*.35):fillAA(length(f)-.05*(.6+.4*sin(uT*.7+r1*60.)));k=.1;
  }else if(uPat==3){ /* rings: the soft concentric circles behind the Smash menus */
    vec2 c0=vec2(asp*.08+.05*sin(uT*.07),.84+.04*cos(uT*.06));
    vec2 c1=vec2(asp*.94+.05*cos(uT*.05),.14+.05*sin(uT*.08));
    float sp=.1;
    for(int i=0;i<2;i++){
      vec2 c=i==0?c0:c1;
      float r=length(uv-c);
      float dl=abs(fract(r/sp+.5)-.5)*sp;
      float ring=fillAA(dl-.0055)*step(sp*.55,r);
      a=max(a,ring*exp(-r*1.7));
    }
    k=.13;
  }else if(uPat==4){ /* waves: slow diagonal ribbons */
    vec2 p=uv*9.;
    float v=(p.x+p.y)*.62+.35*sin(p.x*.9-uT*.15)+.35*cos(p.y*1.1+uT*.12);
    float s=sin(v*6.2832)-.25;
    float w=fwidth(s)*1.1+1e-4;a=smoothstep(-w,w,s);k=.05;
  }else if(uPat==5){ /* daisies: five-petal Y2K flowers that slowly turn */
    vec2 p=uv*5.5+vec2(uT*.012,uT*.008);p.x+=.5*mod(floor(p.y),2.);
    vec2 id=floor(p);vec2 f=fract(p)-.5;
    float ang=atan(f.y,f.x)+(h(id)-.5)*3.+uT*.12*(mod(id.x+id.y,2.)*2.-1.);
    float r=length(f);
    float pet=.17+.075*cos(5.*ang);
    a=fillAA(r-pet)*(1.-fillAA(r-.045));k=.075;
  }else{
    vec2 p=uv*5.4+vec2(uT*.02,uT*.012);
    if(uPat==6){ /* flow: the flag, bent into long smooth curves; two tones, always touching */
      p+=.5*vec2(sin(p.y*.85+uT*.2+.7*sin(p.x*.7)),cos(p.x*.85+uT*.17+.7*cos(p.y*.7)));
      float s=sin(3.14159*p.x)*sin(3.14159*p.y);
      float w=fwidth(s)*1.1+1e-4;a=smoothstep(-w,w,s);k=.055;
    }else{ /* arcs: circles on every other lattice point, breathing from apart, to touching, to fused;
               the two tones meet along curves and cover the whole plane */
      p+=.18*vec2(sin(p.y*1.1+uT*.25),cos(p.x*1.1+uT*.2));
      float s=sin(3.14159*p.x)+sin(3.14159*p.y);
      float c0=1.05+.25*sin(uT*.25);
      float w=fwidth(s)*1.1+1e-4;a=1.-smoothstep(-w,w,s-c0);a=1.-a;k=.07;
      if(uPat==8){ a2=1.-a;k=.10;k2=.07;cA=vec3(.733,1.,0.);cB=vec3(1.,.416,.075); }
    }
  }
  vec3 bg=mix(vec3(.945,.937,.906),vec3(.051,.051,.047),uDark);
  vec3 ln=mix(vec3(.067,.067,.067),vec3(.957,.957,.937),uDark);
  vec2 q=gl_FragCoord.xy/res;
  float edge=smoothstep(.0,.55,length((q-.5)*vec2(1.,.9)));
  float al=k*mix(1.,.85,uDark)*(.6+.4*edge);
  vec3 ink=cA.x>=0.?cA:ln;
  float dk=1.-.5*uDark*float(cA.x>=0.);
  vec3 c=mix(bg,ink,a*al*dk);
  c=mix(c,cB,a2*k2*(.6+.4*edge)*dk);
  o=vec4(c,1.);
}
</script>
<script>
(function(){

  const cv=document.getElementById('bg');
  const gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'low-power'});
  if(!gl){cv.remove();return}
  function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return gl.getShaderParameter(x,gl.COMPILE_STATUS)?x:null}
  const vs=sh(gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}');
  const fs=sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent.trim());
  if(!vs||!fs){cv.remove();return}
  const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){cv.remove();return}
  gl.useProgram(pr);
  const TOFF=+q.get('t')||0;const NAMES=['dots','checker','sparkles','rings','waves','daisies','flow','arcs','arcstint','terrain','blobs','ripples','marble','bubbles','tunnel','ribbons','flatblobs','capsules','dotwave','lines','eyes','capsules2','dotwave2'];let pat=NAMES.indexOf(q.get('bg'));if(pat<0)pat=22;const uPat=gl.getUniformLocation(pr,'uPat');const uRes=gl.getUniformLocation(pr,'uRes'),uT=gl.getUniformLocation(pr,'uT'),uDark=gl.getUniformLocation(pr,'uDark');

  document.addEventListener('visibilitychange',start);mq.addEventListener('change',start);rm.addEventListener('change',start);
